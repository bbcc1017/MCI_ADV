[theme]
# 저장소 루트 .streamlit/config.toml 의 미러. 이 디렉터리에서 직접
# `streamlit run MCI_Streamlit.py` 를 실행할 때 적용된다 (로컬 개발).
# 두 파일은 반드시 같은 값을 유지한다. 팔레트 정본은 src/vis_src/_theme.py.
base = "dark"
primaryColor = "#3BB3C4"
backgroundColor = "#0D1418"
secondaryBackgroundColor = "#111B21"
textColor = "#C9D8DF"
font = "sans serif"

[server]
headless = true
