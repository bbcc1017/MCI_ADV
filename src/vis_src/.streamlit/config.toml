[theme]
# Mirror of the repo-root .streamlit/config.toml so the dark theme also
# applies when the app is launched from this directory (local dev).
# base = "dark" makes Streamlit compute all derived colors (captions,
# secondary/widget text, disabled text) for a dark background.
base = "dark"
primaryColor = "#e2a04a"
backgroundColor = "#141417"
secondaryBackgroundColor = "#1c1c21"
textColor = "#e2e8f0"
font = "sans serif"

[server]
headless = true
